<!doctype html>

<style>
@font-face{font-family:"BSD";font-weight:900;src:url("../src/assets/fonts/big-shoulders-display-900.woff2") format("woff2")}
html,body{margin:0}
/* The light sky of the site: solid behind the name, then the same fade (the
   stops of tokens.css) over the last 240 px. */
body{position:relative;width:1200px;height:630px;overflow:hidden;
  background:linear-gradient(to bottom,#0e91e5 390px,#1f99e6 405px,#2e9fe4 420px,#51afe5 450px,#73bfe5 480px,#93cee7 510px,
    #aad8ec 530px,#c1e3f1 550px,#d8edf6 570px,#ebf5fa 590px,#f8fbfd 610px,#fcfcfe 620px,#fdfdfe 630px);
  color:#fff}
/* The name, alone, with the middle of its letters on the middle of the image.
   The 3 px are the measured offset of the letters inside their line box. */
h1{position:absolute;left:50%;top:50%;margin:0;transform:translate(calc(-50% + 3px),calc(-50% + 3px));
  font:900 132px/0.72 "BSD",sans-serif;letter-spacing:.005em;text-transform:uppercase;white-space:nowrap}
/* The site's day art, in the fade below the text: a cloud at each side and a few doves. */
.art{position:absolute;inset:390px 0 0;-webkit-mask-image:linear-gradient(#000 40%,transparent 92%);mask-image:linear-gradient(#000 40%,transparent 92%)}
.art svg{position:absolute;fill:#fff}
.cloud{opacity:.94}
.c1{left:-28px;top:30%;width:250px}
.c2{right:-32px;top:42%;width:275px;transform:scaleX(-1)}
.c3{left:13%;top:9%;width:92px;opacity:.55}
.c4{right:16%;top:10%;width:80px;opacity:.5;transform:scaleX(-1)}
.d1{left:26%;top:13%;width:36px;transform:rotate(-6deg)}
.d2{left:31%;top:3%;width:24px}
.d3{right:27%;top:30%;width:30px;transform:rotate(-4deg)}
.d4{right:33%;top:8%;width:20px;transform:rotate(-10deg)}
</style>
